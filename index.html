<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Page title, description, canonical, OG, Twitter, JSON-LD injected by react-helmet-async per route -->
    <meta name="theme-color" content="#5d5fef" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FlexPoll" />

    <!-- Prevent dark-mode flash: apply class before React mounts -->
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(t!=='light'&&window.matchMedia('(prefers-color-scheme:dark)').matches)){document.documentElement.classList.add('dark')}}catch(e){}})();</script>

    <!-- Self-hosted Inter: one variable woff2 covering weights 400-800.
         No third-party font request, and the file lands in the PWA precache.
         See public/fonts; regenerate with scripts/generate_fonts.py. -->
    <link rel="preload" href="/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/inter.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="font-family:system-ui,sans-serif;max-width:640px;margin:80px auto;padding:0 24px;text-align:center">
        <h1 style="font-size:2rem;font-weight:800;color:#111">Every kind of poll. Completely free.</h1>
        <p style="margin-top:16px;color:#555">Create and share polls easily — Classic, Ranking, Schedule, Location, Priority, Image, and Custom HTML/CSS/JS poll types. Free forever, open source always.</p>
        <p style="margin-top:24px"><a href="https://github.com/gnadi/0815poll" style="color:#1a56db">View on GitHub</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx" fetchpriority="high"></script>
  </body>
</html>
